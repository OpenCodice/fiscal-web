name: Deploy a producción

# Despliega el Worker (código + frontend) en cada push a main.
# Gate: typecheck + build antes de desplegar, para no publicar algo roto.
# Los datos (Vectorize/KV/R2) los maneja reingest.yml; esto es solo el código.
#
# Secrets requeridos (en este repo):
#   CLOUDFLARE_API_TOKEN   permisos "Edit Cloudflare Workers" (Workers Scripts +
#                          Routes + KV + R2) + Vectorize:Edit
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta
# Nota: los secrets del Worker (OPENAI_API_KEY) se mantienen; `wrangler deploy`
# no los toca.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy (Worker + assets)
        run: npx wrangler deploy
